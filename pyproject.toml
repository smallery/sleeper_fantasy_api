[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper_fantasy_api"
version = "0.1.0"
description = "A Python wrapper for the Sleeper Fantasy API"
readme = "README.md"
authors = [
    {name = "Samuel Mallery", email = "mallerysam@gmail.com"}
]
maintainers = [
    {name = "Samuel Mallery", email = "mallerysam@gmail.com"}
]
license = {text = "MIT"}
keywords = ["sleeper", "fantasy football", "football", "nfl", "sleeper api", "fantasy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "platformdirs==3.8.1",
    "requests==2.31.0",
    "pytest==8.2.2",
]

[project.urls]
"Homepage" = "https://github.com/smallery/sleeper_fantasy_api"
"Issues" = "https://github.com/smallery/sleeper_fantasy_api/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--cov=sleeper_api",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["sleeper_api"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
