name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=sleeper_api --cov-report=term-missing --cov-report=xml

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 sleeper_api --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 sleeper_api --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  import-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check imports
      run: |
        python -c "from sleeper_api.client import SleeperClient; print('✅ Client import OK')"
        python -c "from sleeper_api.endpoints.user_endpoint import UserEndpoint; print('✅ UserEndpoint import OK')"
        python -c "from sleeper_api.endpoints.league_endpoint import LeagueEndpoint; print('✅ LeagueEndpoint import OK')"
        python -c "from sleeper_api.endpoints.player_endpoint import PlayerEndpoint; print('✅ PlayerEndpoint import OK')"
        python -c "from sleeper_api.endpoints.draft_endpoint import DraftEndpoint; print('✅ DraftEndpoint import OK')"
        python -c "from sleeper_api.endpoints.projections_endpoint import ProjectionsEndpoint; print('✅ ProjectionsEndpoint import OK')"
        python -c "from sleeper_api.persistent_cache import PersistentCache; print('✅ PersistentCache import OK')"
        python -c "from sleeper_api.models.nfl_state import NFLStateModel; print('✅ NFLStateModel import OK')"
        python -c "from sleeper_api.models.variance import TeamVarianceModel; print('✅ TeamVarianceModel import OK')"
