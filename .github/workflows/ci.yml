name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pytest is no longer a runtime dependency of this package (it never
        # should have been), so it has to be installed explicitly for CI.
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        # Coverage is reported (see issue #20) but not gated on a threshold --
        # picking a minimum before knowing the real number produces tests
        # written to hit the number rather than to verify behavior.
        pytest -v --cov=sleeper_api --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        # ruff subsumes flake8 (E/F/W) and isort (I) in one fast tool, and
        # this consumer's downstream tooling already standardized on it (#20).
        # No --exit-zero here: a finding fails the job.
        ruff check sleeper_api

  mypy:
    name: Type check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Type check with mypy
      run: |
        # Config lives in pyproject.toml under [tool.mypy]. Deliberately
        # permissive for now (ignore_missing_imports, no --strict) per #20 --
        # the goal is a green, useful gate before py.typed ships (#19), not a
        # strict pass in one PR.
        mypy sleeper_api
