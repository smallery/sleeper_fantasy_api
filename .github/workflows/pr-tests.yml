name: PR Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-all:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-xdist

    - name: Run all tests in parallel
      run: |
        pytest tests/ -v -n auto --cov=sleeper_api --cov-report=term --cov-report=html

    - name: Test breakdown by module
      run: |
        echo "Testing Models..."
        pytest tests/test_model_*.py -v
        echo "Testing Endpoints..."
        pytest tests/test_endpoint_*.py tests/test_projections_endpoint.py tests/test_persistent_cache.py -v
        echo "Testing Client..."
        pytest tests/test_client.py -v
        echo "Testing Integration..."
        pytest tests/test_integration.py -v

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: htmlcov/

  test-new-features:
    runs-on: ubuntu-latest
    name: Test New Features (Projections & Advanced Analytics)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test Projections Endpoint
      run: |
        pytest tests/test_projections_endpoint.py -v --tb=short

    - name: Test Persistent Cache
      run: |
        pytest tests/test_persistent_cache.py -v --tb=short

    - name: Test NFL State Model
      run: |
        pytest tests/test_model_nfl_state.py -v --tb=short

    - name: Test Team Variance Model
      run: |
        pytest tests/test_model_variance.py -v --tb=short

  test-compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run smoke tests
      run: |
        pytest tests/test_model_nfl_state.py tests/test_model_variance.py -v
